name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - run: make setup
      - run: make test
      - name: Linux installer tests
        if: runner.os == 'Linux'
        run: sh scripts/test-install-linux.sh
      - run: make lint
      - run: make build VERSION=ci
      - name: Browser acceptance tests
        if: runner.os == 'Linux'
        run: |
          cd web && npx playwright install --with-deps chromium
          cd .. && make test-e2e VERSION=ci
      - name: Executable smoke check
        run: sh scripts/smoke-test.sh
