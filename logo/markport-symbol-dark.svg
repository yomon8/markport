<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Browser Window Frame -->
  <rect x="8" y="15" width="80" height="66" rx="10" stroke="#75B7FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Window Header Divider -->
  <line x1="8" y1="30" x2="88" y2="30" stroke="#75B7FF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Traffic Dots -->
  <circle cx="18" cy="22.5" r="2.5" fill="#75B7FF" />
  <circle cx="26" cy="22.5" r="2.5" fill="#75B7FF" />
  <circle cx="34" cy="22.5" r="2.5" fill="#75B7FF" />

  <!-- Left Markdown / Code Cues -->
  <!-- Heading # -->
  <path d="M19 45h8 M18 50h8 M21.5 42.5v9.5 M25 42.5v9.5" stroke="#75B7FF" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  
  <!-- Markdown Text Lines -->
  <line x1="18.5" y1="58.5" x2="33" y2="58.5" stroke="#75B7FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <line x1="18.5" y1="65" x2="28" y2="65" stroke="#75B7FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

  <!-- Code Bracket cues { } -->
  <path d="M 20 73 c -2 0 -2.5 1.5 -2.5 3 c 0 1.2 -1 1.8 -2 1.8 c 1 0 2 0.6 2 1.8 c 0 1.5 0.5 3 2.5 3" stroke="#75B7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
  <path d="M 23.5 73 c 2 0 2.5 1.5 2.5 3 c 0 1.2 1 1.8 2 1.8 c -1 0 -2 0.6 -2 1.8 c 0 1.5 -0.5 3 -2.5 3" stroke="#75B7FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- Document Sheet with Folded Corner (Foreground) -->
  <path d="M 48 33 L 73 33 L 88 48 L 88 84 A 7 7 0 0 1 81 91 L 48 91 A 7 7 0 0 1 41 84 L 41 40 A 7 7 0 0 1 48 33 Z" fill="#0D1117" stroke="#75B7FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Dog-ear fold line -->
  <path d="M 73 33 L 73 46 A 2 2 0 0 0 75 48 L 88 48" stroke="#75B7FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Monogram M -->
  <path d="M 53.5 78.5 L 53.5 57 L 64.5 70 L 75.5 57 L 75.5 78.5" stroke="#75B7FF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>